name: Latest blog posts

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://socialofpeach.com/rss.xml"
          max_post_count: 5
          template: "- [$title]($url) <sub>$date</sub>$newline"
          date_format: "yyyy-mm-dd"
          commit_message: "docs: 블로그 최신 글 목록 갱신"
